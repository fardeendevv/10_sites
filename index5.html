<!DOCTYPE html>
<html>
<head>
  <title>Simple Interest</title>
</head>
<body>

<h2>Simple Interest</h2>

<script>
  let p = Number(prompt("Enter principal amount"));
  let r = Number(prompt("Enter rate"));
  let t = Number(prompt("Enter time"));

  let si = (p * r * t) / 100;
  alert("Simple Interest: " + si);
</script>

</body>
</html>
