<!DOCTYPE html>
<html>
<head>
  <title>BMI Calculator</title>
</head>
<body>

<h2>BMI Calculator</h2>

<script>
  let weight = Number(prompt("Enter weight in kg"));
  let height = Number(prompt("Enter height in meters"));

  let bmi = weight / (height * height);
  alert("Your BMI is: " + bmi);
</script>

</body>
</html>
